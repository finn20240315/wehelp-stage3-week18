<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Index</title>
    <link rel="stylesheet" href="/frontend/css/index.css" />
  </head>
  <body>
    <header></header>
    <main>
      <!-- 留言區 -->
      <h3>發表一篇圖文</h3>
      <form id="uploadForm" enctype="multipart/form-data">
        <p>
          文字內容
          <input name="text" id="content" placeholder="寫點什麼吧..." />
        </p>
        <p>
          圖片檔案
          <input type="file" name="file" id="fileInput" style="display: none" />
          <button type="button" id="selectImageBtn">選擇圖片</button>
          <span
            id="fileNameDisplay"
            style="margin-left: 10px; color: #555"
          >未選擇任何檔案</span>
        </p>
        <button type="submit">送出</button>
      </form>
      <hr />
      <!-- 留言板 -->
      <h3>留言區</h3>
      <div id="messageList">尚無任何留言</div>
    </main>
    <footer></footer>
    <script src="/frontend/js/index.js"></script>
  </body>
</html>
